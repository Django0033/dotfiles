palette = "noctalia"
format = """\
[╭╴](fg:arrow)\
$username\
$directory\
$time\
(\
    $git_branch\
    $git_status\
)\
(\
    $python\
    $conda\
    $nodejs\
)\
$cmd_duration
[╰─](fg:arrow)$character\
"""
# Add the modules you need

# Disables the blank line at the start of the prompt
add_newline = true


# Palettes:
#   old: the previous version.
#   normal: dark gray / yellow / white palette.
#   light: pastel light colors.
# To change the colors: change to the corresponding palette.


[palettes.matugen]
arrow = '#a1cafd'
os = '#1a4975'
os_admin = '#1a4975'
directory = '#3c4858'
node = "green"
time = '#533f5f'
git = '#93000a'
git_status = "#8B1D2C"
python = "#3776AB"
conda = "#3EB049"
java = "#861215"
rust = "#C33C00"
clang = "#00599D"
duration = '#1d2024'
text_color = '#d7bee4'
text_light = '#d7bee4'

[username]
style_user = 'os'
style_root = 'os_admin'
format = '[](fg:blue)[  arch](bg:blue fg:text)[](fg:blue)'
disabled = false
show_always = true

[character]
success_symbol = "[󰍟](fg:arrow)"
error_symbol = "[󰍟](fg:red)"

[directory]
format = " [](fg:green)[  $path ](bg:green fg:text)[$read_only]($read_only_style)[](fg:green)"
truncation_length = 2
style = "fg:text_color bg:directory"
read_only_style = "fg:text bg:green"
before_repo_root_style = "fg:text_color bg:directory"
truncation_symbol = "…/"
truncate_to_repo = true
read_only ="  "

[time]
disabled = false
format = " [](fg:yellow)[ $time]($style)[](fg:yellow)"
time_format = "%H:%M"
style = "fg:text bg:yellow"

[cmd_duration]
format = " [](fg:cyan)[ $duration]($style)[](fg:cyan)"
style = "fg:text bg:cyan"
min_time = 500

[git_branch]
format = " [](fg:red)[$symbol$branch](fg:text bg:red)[](fg:red)"
symbol = " "

[git_status]
format = '([ ](fg:magenta)[ $all_status$ahead_behind ]($style)[](fg:magenta))'
style = "fg:text bg:magenta"

[docker_context]
disabled=true
symbol = " "

[package]
disabled=true

[java]
format = "[ ](fg:java)[$symbol$version](bg:java fg:text_color)[](fg:java)"
version_format = "${raw}"
symbol = " "
disabled = true

[nodejs]
format = "[ ](fg:blue)[$symbol$version]($style)[](fg:blue)"
style = "bg:blue fg:text"
symbol = " "
version_format = "${raw}"
disabled=false

[rust]
format = "[ ](fg:rust)[$symbol$version](bg:rust fg:text_color)[](fg:rust)"
symbol = " "
version_format = "${raw}"
disabled=true

[python]
disabled=false
format = '[ ](fg:blue)[${symbol}${pyenv_prefix}(${version} )(\($virtualenv\))]($style)[](fg:blue)'
symbol = " "
version_format = "${raw}"
style = "fg:text bg:blue"

[conda]
format = "[ ](fg:conda)[$symbol$environment]($style)[](fg:conda)"
style = "bg:conda fg:text_color"
ignore_base = false
disabled=false
symbol = " "

[c]
format = "[ ](fg:clang)[$symbol($version(-$name) )](bg:clang fg:text_color)[](fg:clang)"
symbol = " "
version_format = "${raw}"
disabled=true

[os.symbols]
Alpine = " "
Amazon = " "
Android = " "
Arch = " "
CentOS = " "
Debian = " "
DragonFly = " "
Emscripten = " "
EndeavourOS = " "
Fedora = " "
FreeBSD = " "
Gentoo = " "
Linux = " "
Macos = " "
Manjaro = " "
Mariner = " "
MidnightBSD = " "
Mint = " "
NetBSD = " "
NixOS = " "
openSUSE = " "
Pop = " "
Raspbian = " "
Redhat = " "
RedHatEnterprise = " "
Redox = " "
SUSE = " "
Ubuntu = " "
Unknown = " "
Windows = " "

